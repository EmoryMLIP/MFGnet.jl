name: CI

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # Recent stable
          - '1.11'   # Latest stable
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v1

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block CI on formatting issues
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.11'

      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter")'

      - name: Check code formatting
        run: |
          julia -e '
            using JuliaFormatter
            formatted = format(".", verbose=true)
            if !formatted
              @warn "Code formatting changes suggested. Run: julia -e \"using JuliaFormatter; format(\\\".\\\")\" locally."
            else
              @info "All files are properly formatted!"
            end
          '

  quality:
    name: Package Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block CI on quality check issues
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.11'

      - uses: julia-actions/cache@v1

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add("Aqua")
          '

      - name: Run Aqua quality checks
        run: |
          julia --project=. -e '
            using MFGnet
            using Aqua
            # Run with relaxed checks - informational only
            Aqua.test_all(MFGnet,
              ambiguities=false,
              unbound_args=false,  # Relaxed
              undefined_exports=true,
              project_extras=true,
              stale_deps=(ignore=[:Flux],),  # Flux is in extras now
              deps_compat=true,
              piracy=false  # Relaxed
            )
          '

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.11'

      - name: Check for documentation
        run: |
          if [ -d "docs" ]; then
            julia --project=docs -e '
              using Pkg
              Pkg.develop(PackageSpec(path=pwd()))
              Pkg.instantiate()
            '
          else
            echo "No docs directory found, skipping documentation build"
          fi
